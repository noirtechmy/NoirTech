<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoirTech Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B;--bg2:#111114;--bg3:#18181C;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --fg:#EDEDED;--fg2:#A1A1AA;--fg3:#71717A;
  --green:#4ADE80;--green-bg:rgba(74,222,128,.08);--green-line:rgba(74,222,128,.28);
  --amber:#FBBF24;--amber-bg:rgba(251,191,36,.08);--amber-line:rgba(251,191,36,.28);
  --red:#F87171;--red-bg:rgba(248,113,113,.08);--red-line:rgba(248,113,113,.28);
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-size:14px;background:var(--bg);color:var(--fg2);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--fg3);outline-offset:2px;border-radius:4px}

/* ══ LOGIN ══ */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.lcard{width:100%;max-width:370px;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:36px 32px}
.lbrand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--fg)}
.lbrand span{font-weight:700;font-size:16px;letter-spacing:-.03em;color:var(--fg)}
.lbrand small{font-size:12px;color:var(--fg3);font-weight:400;margin-left:2px}
.lcard h1{font-size:20px;font-weight:600;letter-spacing:-.03em;color:var(--fg);margin-bottom:6px}
.lcard>p{font-size:13.5px;color:var(--fg3);margin-bottom:24px;line-height:1.6}
.fld{margin-bottom:14px}
.lbl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-bottom:7px}
.inp{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--line2);border-radius:9px;color:var(--fg);font:inherit;font-size:15px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--fg3)}
.btn-go{width:100%;padding:13px;background:var(--fg);color:var(--bg);border-radius:9px;font-weight:600;font-size:15px;margin-top:6px;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-go:hover:not(:disabled){opacity:.88}
.btn-go:disabled{opacity:.45;cursor:not-allowed}
.lerr{color:var(--red);font-size:13px;margin-top:12px;line-height:1.5;display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(128,128,128,.3);border-top-color:currentColor;border-radius:50%;animation:sp .65s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══ SHELL ══ */
#app{display:none}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,26px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.03em;color:var(--fg)}
.brand small{font-weight:400;color:var(--fg3);font-size:12px}
.top-r{display:flex;align-items:center;gap:12px}
.who{font-size:12.5px;color:var(--fg3);display:none}
@media(min-width:600px){.who{display:block}}
.out{font-size:13px;color:var(--fg3);padding:8px 15px;border:1px solid var(--line2);border-radius:8px;transition:color .2s,border-color .2s}
.out:hover{color:var(--fg);border-color:var(--fg3)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--bg);padding:18px clamp(16px,3vw,26px)}
.stat-k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-bottom:7px}
.stat-v{font-size:26px;font-weight:600;color:var(--fg);letter-spacing:-.04em;line-height:1}

/* tabs */
.tabs{display:flex;gap:2px;padding:16px clamp(16px,3vw,26px) 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 18px;border-radius:9px;font-size:13.5px;color:var(--fg3);white-space:nowrap;transition:color .2s,background .2s}
.tab:hover{color:var(--fg2)}
.tab.on{color:var(--fg);background:var(--bg2)}
.pane{display:none;padding:20px clamp(16px,3vw,26px) 40px}
.pane.on{display:block}

/* filters */
.filters{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.fbtn{padding:7px 15px;border:1px solid var(--line2);border-radius:100px;font-size:12.5px;color:var(--fg3);transition:color .2s,border-color .2s}
.fbtn:hover{color:var(--fg2)}
.fbtn.on{color:var(--fg);border-color:var(--fg3)}

/* cards list */
.list{display:flex;flex-direction:column;gap:9px}
.item{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px 20px;transition:border-color .2s}
.item:hover{border-color:var(--line2)}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.item-name{font-size:15.5px;font-weight:600;color:var(--fg);letter-spacing:-.02em;margin-bottom:4px}
.item-meta{font-family:var(--mono);font-size:11.5px;color:var(--fg3);letter-spacing:.03em}
.item-body{font-size:14px;line-height:1.7;color:var(--fg2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.item-acts{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap}
.act{padding:6px 13px;border:1px solid var(--line2);border-radius:7px;font-size:12.5px;color:var(--fg3);transition:color .2s,border-color .2s,background .2s}
.act:hover{color:var(--fg);border-color:var(--fg3)}
.act.danger{color:var(--red);border-color:var(--red-line)}
.act.danger:hover{background:var(--red-bg)}
.badge{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;padding:4px 10px;border-radius:100px;border:1px solid var(--line2);color:var(--fg3)}
.badge.new,.badge.confirmed{color:var(--green);border-color:var(--green-line);background:var(--green-bg)}
.badge.replied{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.badge.cancelled{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}

/* availability */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:32px}
.day{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px}
.day-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.day-h b{font-size:14.5px;font-weight:600;color:var(--fg);letter-spacing:-.02em}
.tog{width:38px;height:21px;border-radius:11px;border:1px solid var(--line2);background:var(--bg3);position:relative;transition:background .25s,border-color .25s;flex-shrink:0}
.tog.on{background:var(--fg);border-color:var(--fg)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--fg3);transition:transform .25s var(--ease),background .25s}
.tog.on::after{transform:translateX(17px);background:var(--bg)}
.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.slot{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--fg2)}
.slot-x{color:var(--fg3);padding:2px 6px;border-radius:5px;font-size:15px;line-height:1;transition:color .2s}
.slot-x:hover{color:var(--red)}
.addrow{display:flex;gap:6px;align-items:center}
.tinp{padding:8px 10px;background:var(--bg);border:1px solid var(--line2);border-radius:7px;color:var(--fg);font:inherit;font-size:13px;outline:none;flex:1;min-width:0}
.tinp:focus{border-color:var(--fg3)}
.blk{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:8px}
.blk-t{font-size:14px;color:var(--fg)}
.blk-r{font-size:12.5px;color:var(--fg3);margin-top:2px}
.addblk{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}
.sec-h{font-size:16px;font-weight:600;color:var(--fg);letter-spacing:-.025em;margin-bottom:16px}

/* states */
.empty,.loading{padding:44px 20px;text-align:center;color:var(--fg3);font-size:14px;line-height:1.6}
.skel{height:76px;border-radius:12px;background:var(--bg2);animation:pulse 1.4s ease-in-out infinite;margin-bottom:9px}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.85}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:var(--bg3);border:1px solid var(--line2);color:var(--fg);font-size:13.5px;padding:12px 20px;border-radius:10px;transition:opacity .3s,transform .3s var(--ease);z-index:99;box-shadow:0 10px 34px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login">
  <div class="lcard">
    <div class="lbrand"><span class="ldot"></span><span>NoirTech</span><small>Admin</small></div>
    <h1>Sign in</h1>
    <p>Use the admin account you created in Supabase.</p>

    <div class="fld">
      <label class="lbl" for="em">Email</label>
      <input class="inp" type="email" id="em" placeholder="noirtechmy@gmail.com" autocomplete="username">
    </div>
    <div class="fld">
      <label class="lbl" for="pw">Password</label>
      <input class="inp" type="password" id="pw" placeholder="Your password" autocomplete="current-password">
    </div>
    <button class="btn-go" id="signin">Sign in</button>
    <p class="lerr" id="lerr"></p>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app">
  <div class="top">
    <div class="brand"><span class="ldot"></span>NoirTech<small>Admin</small></div>
    <div class="top-r">
      <span class="who" id="who"></span>
      <button class="out" id="out">Sign out</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-k">New enquiries</div><div class="stat-v" id="sNew">&mdash;</div></div>
    <div class="stat"><div class="stat-k">Upcoming calls</div><div class="stat-v" id="sUp">&mdash;</div></div>
    <div class="stat"><div class="stat-k">This month</div><div class="stat-v" id="sMonth">&mdash;</div></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="enq">Enquiries</button>
    <button class="tab" data-t="bk">Bookings</button>
    <button class="tab" data-t="av">Availability</button>
  </div>

  <div class="pane on" id="p-enq">
    <div class="filters" id="fEnq">
      <button class="fbtn on" data-f="all">All</button>
      <button class="fbtn" data-f="new">New</button>
      <button class="fbtn" data-f="replied">Replied</button>
      <button class="fbtn" data-f="archived">Archived</button>
    </div>
    <div id="enqList"><div class="skel"></div><div class="skel"></div></div>
  </div>

  <div class="pane" id="p-bk">
    <div class="filters" id="fBk">
      <button class="fbtn on" data-f="all">All</button>
      <button class="fbtn" data-f="confirmed">Upcoming</button>
      <button class="fbtn" data-f="completed">Completed</button>
      <button class="fbtn" data-f="cancelled">Cancelled</button>
    </div>
    <div id="bkList"><div class="skel"></div><div class="skel"></div></div>
  </div>

  <div class="pane" id="p-av">
    <p class="sec-h">Weekly schedule</p>
    <div class="days" id="days"><div class="skel"></div></div>
    <p class="sec-h">Blocked dates</p>
    <div id="blkList"></div>
    <div class="addblk">
      <div>
        <label class="lbl" for="bd">Date</label>
        <input class="tinp" type="date" id="bd" style="width:165px">
      </div>
      <div style="flex:1;min-width:170px">
        <label class="lbl" for="br">Reason</label>
        <input class="tinp" type="text" id="br" placeholder="e.g. Public holiday" style="width:100%">
      </div>
      <button class="act" id="addBlk" style="height:37px">Add</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";

  /* ----------------------------------------------------------
     SAFE: this is the anon public key. It grants nothing on its
     own  every table is protected by Row Level Security, so
     data is only readable once you are signed in.
     ---------------------------------------------------------- */
  var URL_ = "https://lzxiwmhvvnvalgglczit.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6eGl3bWh2dm52YWxnZ2xjeml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MzgxMTUsImV4cCI6MjEwMTQxNDExNX0.nNKzBu-A0f4ddGZ9U2xOmC2lfsjklVFvqvXtL9QIf2w";

  var sb = window.supabase.createClient(URL_, ANON);
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var fEnq = "all", fBk = "all";

  var $ = function(id){ return document.getElementById(id); };
  function el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }
  function esc(s){ return String(s==null?"":s); }

  var tT;
  function toast(m){
    var t=$("toast"); t.textContent=m; t.classList.add("on");
    clearTimeout(tT); tT=setTimeout(function(){t.classList.remove("on");},3200);
  }

  /* == AUTH == */
  var signin=$("signin"), lerr=$("lerr");

  function showApp(user){
    $("login").style.display="none";
    $("app").style.display="block";
    $("who").textContent=user.email;
    loadAll();
  }

  sb.auth.getSession().then(function(r){
    if(r.data.session) showApp(r.data.session.user);
  });

  function doLogin(){
    var email=$("em").value.trim(), pass=$("pw").value;
    if(!email||!pass){ lerr.textContent="Enter your email and password."; lerr.style.display="block"; return; }
    lerr.style.display="none";
    signin.disabled=true; signin.innerHTML='<span class="spin"></span>Signing in';
    sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){
      if(r.error){
        lerr.textContent=r.error.message==="Invalid login credentials"
          ? "Incorrect email or password." : r.error.message;
        lerr.style.display="block";
        signin.disabled=false; signin.textContent="Sign in";
      } else {
        showApp(r.data.user);
      }
    });
  }
  signin.addEventListener("click", doLogin);
  ["em","pw"].forEach(function(id){
    $(id).addEventListener("keydown", function(e){ if(e.key==="Enter") doLogin(); });
  });
  $("out").addEventListener("click", function(){
    sb.auth.signOut().then(function(){ location.reload(); });
  });

  /* == TABS == */
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(x){ x.classList.remove("on"); });
      Array.prototype.forEach.call(document.querySelectorAll(".pane"), function(x){ x.classList.remove("on"); });
      t.classList.add("on");
      $("p-"+t.dataset.t).classList.add("on");
    });
  });

  /* == FILTERS == */
  function wireFilters(wrapId, setter, reload){
    Array.prototype.forEach.call($(wrapId).querySelectorAll(".fbtn"), function(b){
      b.addEventListener("click", function(){
        Array.prototype.forEach.call($(wrapId).querySelectorAll(".fbtn"), function(x){ x.classList.remove("on"); });
        b.classList.add("on");
        setter(b.dataset.f);
        reload();
      });
    });
  }
  wireFilters("fEnq", function(v){ fEnq=v; }, function(){ loadEnq(); });
  wireFilters("fBk",  function(v){ fBk=v;  }, function(){ loadBk();  });

  function loadAll(){ loadEnq(); loadBk(); loadAvail(); loadBlocked(); }

  /* == ENQUIRIES == */
  function loadEnq(){
    var box=$("enqList");
    var q=sb.from("enquiries").select("*").order("created_at",{ascending:false});
    if(fEnq!=="all") q=q.eq("status",fEnq);

    q.then(function(r){
      box.innerHTML="";
      if(r.error){ box.appendChild(el("div","empty","Could not load: "+r.error.message)); return; }
      var rows=r.data||[];
      if(!rows.length){ box.appendChild(el("div","empty","No enquiries here yet.")); return; }

      var list=el("div","list");
      rows.forEach(function(row){
        var it=el("div","item");
        var top=el("div","item-top");

        var L=el("div");
        L.appendChild(el("div","item-name",row.name));
        var when=new Date(row.created_at).toLocaleString("en-MY",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
        L.appendChild(el("div","item-meta",row.contact+"  \u00b7  "+when));
        top.appendChild(L);

        var R=el("div","item-acts");
        R.appendChild(el("span","badge "+row.status,row.status));
        if(row.status!=="replied"){
          var b1=el("button","act","Mark replied");
          b1.addEventListener("click",function(){ setStatus("enquiries",row.id,"replied",loadEnq); });
          R.appendChild(b1);
        }
        if(row.status!=="archived"){
          var b2=el("button","act","Archive");
          b2.addEventListener("click",function(){ setStatus("enquiries",row.id,"archived",loadEnq); });
          R.appendChild(b2);
        }
        top.appendChild(R);
        it.appendChild(top);
        it.appendChild(el("div","item-body",row.message));
        list.appendChild(it);
      });
      box.appendChild(list);

      var news=rows.filter(function(x){return x.status==="new";}).length;
      if(fEnq==="all") $("sNew").textContent=news;
      var now=new Date(), mo=now.getMonth(), yr=now.getFullYear();
      $("sMonth").textContent=rows.filter(function(x){
        var d=new Date(x.created_at); return d.getMonth()===mo&&d.getFullYear()===yr;
      }).length;
    });
  }

  /* == BOOKINGS == */
  function loadBk(){
    var box=$("bkList");
    var q=sb.from("bookings").select("*").order("booking_date",{ascending:true}).order("start_time",{ascending:true});
    if(fBk!=="all") q=q.eq("status",fBk);

    q.then(function(r){
      box.innerHTML="";
      if(r.error){ box.appendChild(el("div","empty","Could not load: "+r.error.message)); return; }
      var rows=r.data||[];
      if(!rows.length){ box.appendChild(el("div","empty","No bookings here yet.")); return; }

      function ft(t){ var p=t.split(":"),h=parseInt(p[0],10); return (h%12||12)+":"+p[1]+" "+(h>=12?"pm":"am"); }

      var list=el("div","list");
      rows.forEach(function(row){
        var it=el("div","item");
        var top=el("div","item-top");

        var L=el("div");
        L.appendChild(el("div","item-name",row.client_name));
        var dt=new Date(row.booking_date+"T00:00:00").toLocaleDateString("en-MY",{weekday:"short",day:"numeric",month:"short"});
        L.appendChild(el("div","item-meta",dt+", "+ft(row.start_time)+"  \u00b7  "+row.service_type));
        L.appendChild(el("div","item-meta",row.client_email));
        top.appendChild(L);

        var R=el("div","item-acts");
        R.appendChild(el("span","badge "+row.status,row.status));
        if(row.status==="confirmed"){
          var b1=el("button","act","Mark done");
          b1.addEventListener("click",function(){ setStatus("bookings",row.id,"completed",loadBk); });
          var b2=el("button","act danger","Cancel");
          b2.addEventListener("click",function(){
            if(confirm("Cancel this booking? The client will not be emailed automatically.")) setStatus("bookings",row.id,"cancelled",loadBk);
          });
          R.appendChild(b1); R.appendChild(b2);
        }
        top.appendChild(R);
        it.appendChild(top);
        if(row.notes) it.appendChild(el("div","item-body",row.notes));
        list.appendChild(it);
      });
      box.appendChild(list);

      var today=new Date().toISOString().split("T")[0];
      $("sUp").textContent=rows.filter(function(x){
        return x.status==="confirmed" && x.booking_date>=today;
      }).length;
    });
  }

  function setStatus(table,id,status,after){
    sb.from(table).update({status:status}).eq("id",id).then(function(r){
      if(r.error) toast("Failed: "+r.error.message);
      else { toast("Updated."); after(); }
    });
  }

  /* == AVAILABILITY == */
  function loadAvail(){
    sb.from("availability_slots").select("*")
      .order("day_of_week",{ascending:true}).order("start_time",{ascending:true})
      .then(function(r){
        var box=$("days"); box.innerHTML="";
        if(r.error){ box.appendChild(el("div","empty","Could not load: "+r.error.message)); return; }
        var all=r.data||[];

        for(var dow=0; dow<=6; dow++){
          (function(dw){
            var mine=all.filter(function(s){ return s.day_of_week===dw; });
            var card=el("div","day");

            var h=el("div","day-h");
            h.appendChild(el("b",null,DAYS[dw]));
            var on=mine.some(function(s){ return s.is_active; });
            var tg=el("button","tog"+(on?" on":""));
            tg.type="button";
            tg.addEventListener("click",function(){
              var next=!tg.classList.contains("on");
              tg.classList.toggle("on",next);
              if(!mine.length){ toast("Add a time range first."); tg.classList.toggle("on",!next); return; }
              var ids=mine.map(function(s){return s.id;});
              sb.from("availability_slots").update({is_active:next}).in("id",ids).then(function(res){
                if(res.error) toast("Failed: "+res.error.message);
                else toast(DAYS[dw]+(next?" enabled.":" disabled."));
              });
            });
            h.appendChild(tg);
            card.appendChild(h);

            var sl=el("div","slots");
            if(!mine.length){
              var none=el("div","slot"); none.style.opacity=".55";
              none.appendChild(el("span",null,"No hours set"));
              sl.appendChild(none);
            }
            mine.forEach(function(s){
              var row=el("div","slot");
              row.appendChild(el("span",null,s.start_time.slice(0,5)+" \u2013 "+s.end_time.slice(0,5)));
              var x=el("button","slot-x","\u00d7"); x.type="button";
              x.addEventListener("click",function(){
                sb.from("availability_slots").delete().eq("id",s.id).then(function(res){
                  if(res.error) toast("Failed: "+res.error.message);
                  else { toast("Removed."); loadAvail(); }
                });
              });
              row.appendChild(x);
              sl.appendChild(row);
            });
            card.appendChild(sl);

            var add=el("div","addrow");
            var s1=el("input","tinp"); s1.type="time";
            var s2=el("input","tinp"); s2.type="time";
            var ab=el("button","act","Add"); ab.type="button";
            ab.addEventListener("click",function(){
              if(!s1.value||!s2.value){ toast("Set both times."); return; }
              if(s2.value<=s1.value){ toast("End must be after start."); return; }
              sb.from("availability_slots").insert({
                day_of_week:dw, start_time:s1.value, end_time:s2.value, is_active:true
              }).then(function(res){
                if(res.error) toast("Failed: "+res.error.message);
                else { toast("Added."); loadAvail(); }
              });
            });
            add.appendChild(s1); add.appendChild(s2); add.appendChild(ab);
            card.appendChild(add);
            box.appendChild(card);
          })(dow);
        }
      });
  }

  /* == BLOCKED DATES == */
  function loadBlocked(){
    sb.from("blocked_dates").select("*").order("blocked_date",{ascending:true}).then(function(r){
      var box=$("blkList"); box.innerHTML="";
      if(r.error){ box.appendChild(el("div","empty","Could not load: "+r.error.message)); return; }
      var rows=r.data||[];
      if(!rows.length){
        var e=el("div","empty","No blocked dates.");
        e.style.padding="18px 0"; e.style.textAlign="left";
        box.appendChild(e);
        return;
      }
      rows.forEach(function(row){
        var b=el("div","blk");
        var L=el("div");
        L.appendChild(el("div","blk-t",new Date(row.blocked_date+"T00:00:00").toLocaleDateString("en-MY",{weekday:"long",day:"numeric",month:"long",year:"numeric"})));
        if(row.reason) L.appendChild(el("div","blk-r",row.reason));
        b.appendChild(L);
        var x=el("button","act danger","Remove"); x.type="button";
        x.addEventListener("click",function(){
          sb.from("blocked_dates").delete().eq("id",row.id).then(function(res){
            if(res.error) toast("Failed: "+res.error.message);
            else { toast("Removed."); loadBlocked(); }
          });
        });
        b.appendChild(x);
        box.appendChild(b);
      });
    });
  }

  $("addBlk").addEventListener("click", function(){
    var d=$("bd").value, rr=$("br").value.trim();
    if(!d){ toast("Pick a date."); return; }
    sb.from("blocked_dates").insert({blocked_date:d, reason:rr||null}).then(function(res){
      if(res.error) toast("Failed: "+res.error.message);
      else { $("bd").value=""; $("br").value=""; toast("Date blocked."); loadBlocked(); }
    });
  });

})();
</script>
</body>
</html>
